<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sponsor Portal</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.topbar{
  height:65px;
  background:#1473f9;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
}

.topbar h2{
  font-size:22px;
}

.logout{
  background:white;
  color:#1473f9;
  border:0;
  border-radius:10px;
  padding:12px 20px;
  font-size:16px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 20px;
}

.section{
  background:white;
  border-radius:18px;
  padding:25px;
  margin-bottom:22px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.section h2{
  font-size:25px;
  margin-bottom:25px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.card-title{
  color:#777;
  font-size:14px;
  margin-bottom:10px;
}

.card-value{
  font-size:25px;
  font-weight:bold;
}

.menu{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.menu button{
  border:0;
  background:#edf4ff;
  color:#1473f9;
  padding:18px;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
}

.status{
  background:#f5f6f8;
  padding:20px;
  border-radius:12px;
  text-align:center;
  line-height:2;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

.error{
  color:#d6334c;
  background:#fff0f2;
  padding:20px;
  border-radius:12px;
  line-height:1.8;
}

.success{
  color:#198754;
  background:#eaf8f0;
  padding:20px;
  border-radius:12px;
  line-height:1.8;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:13px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#f8f9fa;
}

@media(max-width:800px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .menu{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:500px){

  .topbar{
    padding:0 20px;
  }

  .topbar h2{
    font-size:18px;
  }

  .container{
    padding:15px;
  }

  .section{
    padding:20px;
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .card{
    padding:15px;
  }

  .card-value{
    font-size:19px;
  }

}

</style>
</head>

<body>

<div class="topbar">

  <h2>SPONSOR PORTAL</h2>

  <button class="logout" id="logoutBtn">
    Logout
  </button>

</div>


<div class="container">


  <!-- DASHBOARD -->

  <div class="cards">

    <div class="card">
      <div class="card-title">TOTAL SPONSORS</div>
      <div class="card-value" id="totalSponsors">
        0
      </div>
    </div>

    <div class="card">
      <div class="card-title">TOTAL SPONSORSHIP</div>
      <div class="card-value" id="totalAmount">
        ₹0
      </div>
    </div>

    <div class="card">
      <div class="card-title">TOTAL RECEIVED</div>
      <div class="card-value" id="totalPaid">
        ₹0
      </div>
    </div>

    <div class="card">
      <div class="card-title">TOTAL PENDING</div>
      <div class="card-value" id="totalPending">
        ₹0
      </div>
    </div>

  </div>


  <!-- MANAGEMENT -->

  <div class="section">

    <h2>Management</h2>

    <div class="menu">

      <button>👥 Sponsors</button>

      <button>💰 Payments</button>

      <button>⏳ Pending</button>

      <button>💬 Messages</button>

      <button>🔔 Reminders</button>

      <button>📊 Reports</button>

      <button>🔔 Notifications</button>

      <button>⚙️ Settings</button>

    </div>

  </div>


  <!-- SPONSORS -->

  <div class="section">

    <h2>👥 Sponsors</h2>

    <div id="result" class="loading">

      Checking Firebase...

    </div>

  </div>


  <!-- SYSTEM -->

  <div class="section">

    <h2>System Status</h2>

    <div id="systemStatus" class="status">

      Connecting...

    </div>

  </div>


</div>


<script type="module">


/* ================================
   FIREBASE IMPORTS
================================ */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {

  apiKey:
  "AIzaSyA4GwvJ1W12dB61MknzffCAazBVN60gCOc",

  authDomain:
  "sponsors-management-port-2300e.firebaseapp.com",

  projectId:
  "sponsors-management-port-2300e",

  storageBucket:
  "sponsors-management-port-2300e.firebasestorage.app",

  messagingSenderId:
  "302644033627",

  appId:
  "1:302644033627:web:bfb03201ee44bcf616677e"

};


/* ================================
   INITIALIZE
================================ */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ================================
   IMPORTANT VALUES
================================ */

const COLLECTION_NAME =
"Sponsors";

const DOCUMENT_ID =
"OjBhUgDNyY5ry63Ajxd8";


/* ================================
   MONEY
================================ */

function money(value){

  return new Intl.NumberFormat(
    "en-IN",
    {
      style:"currency",
      currency:"INR",
      maximumFractionDigits:0
    }
  ).format(
    Number(value) || 0
  );

}


/* ================================
   LOAD DATA
================================ */

async function loadData(){

  const result =
  document.getElementById("result");

  const status =
  document.getElementById("systemStatus");


  try{

    /* -----------------------------
       TEST 1
       DIRECT DOCUMENT
    ----------------------------- */

    const documentReference =
    doc(
      db,
      COLLECTION_NAME,
      DOCUMENT_ID
    );


    const documentSnapshot =
    await getDoc(
      documentReference
    );


    /* -----------------------------
       TEST 2
       COLLECTION
    ----------------------------- */

    const collectionReference =
    collection(
      db,
      COLLECTION_NAME
    );


    const collectionSnapshot =
    await getDocs(
      collectionReference
    );


    /* -----------------------------
       SHOW RESULT
    ----------------------------- */

    console.log(
      "Project:",
      "sponsors-management-port-2300e"
    );

    console.log(
      "Collection:",
      COLLECTION_NAME
    );

    console.log(
      "Document:",
      DOCUMENT_ID
    );

    console.log(
      "Direct document exists:",
      documentSnapshot.exists()
    );

    console.log(
      "Collection documents:",
      collectionSnapshot.size
    );


    /* -----------------------------
       IF DOCUMENT FOUND
    ----------------------------- */

    if(documentSnapshot.exists()){

      const data =
      documentSnapshot.data();


      const name =
      data.name || "-";

      const phone =
      data.phone || "-";

      const total =
      Number(
        data.totalAmount || 0
      );

      const paid =
      Number(
        data.paidAmount || 0
      );

      const balance =
      data.balanceAmount !== undefined
      ?
      Number(data.balanceAmount)
      :
      Math.max(
        total-paid,
        0
      );


      document.getElementById(
        "totalSponsors"
      ).textContent =
      collectionSnapshot.size;


      document.getElementById(
        "totalAmount"
      ).textContent =
      money(total);


      document.getElementById(
        "totalPaid"
      ).textContent =
      money(paid);


      document.getElementById(
        "totalPending"
      ).textContent =
      money(balance);


      result.className =
      "success";


      result.innerHTML = `

        <h3>✅ DOCUMENT FOUND</h3>

        <br>

        <strong>Name:</strong>
        ${name}

        <br>

        <strong>Phone:</strong>
        ${phone}

        <br>

        <strong>Total:</strong>
        ${money(total)}

        <br>

        <strong>Paid:</strong>
        ${money(paid)}

        <br>

        <strong>Balance:</strong>
        ${money(balance)}

        <br><br>

        <strong>Document ID:</strong>
        ${DOCUMENT_ID}

        <br>

        <strong>Collection documents:</strong>
        ${collectionSnapshot.size}

      `;


      status.innerHTML = `

        <strong style="color:#198754">
        Firebase connected ✓
        </strong>

        <br>

        Project:
        <strong>
        sponsors-management-port-2300e
        </strong>

        <br>

        Collection:
        <strong>
        Sponsors
        </strong>

        <br>

        Document:
        <strong>
        FOUND ✓
        </strong>

      `;

      return;

    }


    /* -----------------------------
       DOCUMENT NOT FOUND
    ----------------------------- */

    result.className =
    "error";


    result.innerHTML = `

      <strong>
      ❌ DIRECT DOCUMENT NOT FOUND
      </strong>

      <br><br>

      Project:
      sponsors-management-port-2300e

      <br><br>

      Collection:
      Sponsors

      <br><br>

      Document ID:

      <br>

      <strong>
      ${DOCUMENT_ID}
      </strong>

      <br><br>

      Collection documents:

      <strong>
      ${collectionSnapshot.size}
      </strong>

      <br><br>

      This means Firebase is connected,
      but this exact path is not being
      returned by Firestore.

    `;


    status.innerHTML = `

      Firebase connected ✓

      <br>

      Project:
      <strong>
      sponsors-management-port-2300e
      </strong>

      <br>

      Collection:
      <strong>
      Sponsors
      </strong>

      <br>

      Collection documents:
      <strong>
      ${collectionSnapshot.size}
      </strong>

      <br>

      Direct document:
      <strong>
      NOT FOUND
      </strong>

    `;


  }

  catch(error){

    console.error(
      "FIREBASE ERROR:",
      error
    );


    result.className =
    "error";


    result.innerHTML = `

      <strong>
      ❌ FIREBASE ERROR
      </strong>

      <br><br>

      Error code:

      <strong>
      ${error.code || "unknown"}
      </strong>

      <br><br>

      Error message:

      <strong>
      ${error.message}
      </strong>

    `;


    status.innerHTML = `

      <strong style="color:#dc3545">
      Firebase Error ✕
      </strong>

      <br>

      ${error.code || ""}

    `;

  }

}


/* ================================
   LOGIN CHECK
================================ */

onAuthStateChanged(
  auth,
  async(user)=>{

    if(!user){

      window.location.href =
      "index.html";

      return;

    }


    console.log(
      "Logged in:",
      user.email
    );


    await loadData();

  }
);


/* ================================
   LOGOUT
================================ */

document
.getElementById("logoutBtn")
.addEventListener(
  "click",
  async()=>{

    await signOut(auth);

    window.location.href =
    "index.html";

  }
);


</script>

</body>
</html>
