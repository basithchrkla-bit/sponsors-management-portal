<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Sponsor Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .topbar {
      min-height: 65px;
      background: #0d6efd;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar h2 {
      font-size: 20px;
    }

    .logout {
      border: none;
      background: white;
      color: #0d6efd;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .welcome p {
      color: #777;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card-title {
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 24px;
      font-weight: bold;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .section h2 {
      margin-bottom: 15px;
      font-size: 19px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .menu button {
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #eef4ff;
      color: #0d6efd;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .menu button:hover {
      background: #dce9ff;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .sponsor-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    .sponsor-table th,
    .sponsor-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    .sponsor-table th {
      background: #f8f9fa;
      color: #555;
    }

    .paid {
      color: #198754;
      font-weight: bold;
    }

    .pending {
      color: #dc3545;
      font-weight: bold;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #f8f9fa;
      color: #777;
      text-align: center;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .error {
      color: #dc3545;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 850px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .menu {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .card {
        padding: 15px;
      }

      .card-value {
        font-size: 19px;
      }

      .menu {
        grid-template-columns: 1fr 1fr;
      }

      .topbar h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">

    <h2>SPONSOR PORTAL</h2>

    <button
      class="logout"
      id="logoutBtn">
      Logout
    </button>

  </div>


  <main class="container">

    <div class="welcome">

      <h1>Admin Dashboard</h1>

      <p id="adminEmail">
        Loading...
      </p>

    </div>


    <!-- SUMMARY -->

    <div class="cards">

      <div class="card">
        <div class="card-title">
          TOTAL SPONSORS
        </div>

        <div
          class="card-value"
          id="totalSponsors">
          0
        </div>
      </div>


      <div class="card">
        <div class="card-title">
          TOTAL SPONSORSHIP
        </div>

        <div
          class="card-value"
          id="totalSponsorship">
          ₹0
        </div>
      </div>


      <div class="card">
        <div class="card-title">
          TOTAL RECEIVED
        </div>

        <div
          class="card-value"
          id="totalReceived">
          ₹0
        </div>
      </div>


      <div class="card">
        <div class="card-title">
          TOTAL PENDING
        </div>

        <div
          class="card-value"
          id="totalPending">
          ₹0
        </div>
      </div>

    </div>


    <!-- MANAGEMENT -->

    <div class="section">

      <h2>Management</h2>

      <div class="menu">

        <button onclick="goSponsors()">
          👥 Sponsors
        </button>

        <button onclick="comingSoon('Payments')">
          💰 Payments
        </button>

        <button onclick="comingSoon('Pending Payments')">
          ⏳ Pending
        </button>

        <button onclick="comingSoon('Messages')">
          💬 Messages
        </button>

        <button onclick="comingSoon('Reminders')">
          🔔 Reminders
        </button>

        <button onclick="comingSoon('Reports')">
          📊 Reports
        </button>

        <button onclick="comingSoon('Notifications')">
          🔔 Notifications
        </button>

        <button onclick="comingSoon('Settings')">
          ⚙️ Settings
        </button>

      </div>

    </div>


    <!-- SPONSORS -->

    <div
      class="section"
      id="sponsorsSection">

      <h2>👥 Sponsors</h2>

      <div
        id="loading"
        class="loading">

        Loading sponsors...

      </div>

      <div
        id="sponsorContainer">
      </div>

    </div>


    <!-- STATUS -->

    <div class="section">

      <h2>System Status</h2>

      <div
        class="status"
        id="systemStatus">

        Connecting to Firebase...

      </div>

    </div>

  </main>


  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* FIREBASE */

    const firebaseConfig = {

      apiKey:
        "AIzaSyA4GwvJ1W12dB61MknzffCAazBVN60gCOc",

      authDomain:
        "sponsors-management-port-2300e.firebaseapp.com",

      projectId:
        "sponsors-management-port-2300e",

      storageBucket:
        "sponsors-management-port-2300e.firebasestorage.app",

      messagingSenderId:
        "302644033627",

      appId:
        "1:302644033627:web:bfb03201ee44bcf616677e"
    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /* MONEY */

    function money(value) {

      return new Intl.NumberFormat(
        "en-IN",
        {
          style: "currency",
          currency: "INR",
          maximumFractionDigits: 0
        }
      ).format(
        Number(value) || 0
      );

    }


    /* HTML SAFE */

    function safe(value) {

      return String(value ?? "-")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* LOAD SPONSORS */

    async function loadSponsors() {

      const loading =
        document.getElementById("loading");

      const container =
        document.getElementById(
          "sponsorContainer"
        );


      try {

        /*
          EXACT FIRESTORE COLLECTION

          Sponsors
        */

        const ref =
          collection(db, "Sponsors");


        const snapshot =
          await getDocs(ref);


        console.log(
          "Sponsors found:",
          snapshot.size
        );


        let count = 0;

        let total = 0;

        let received = 0;

        let pending = 0;


        let rows = "";


        snapshot.forEach(
          (doc) => {

            const data =
              doc.data();


            const name =
              data.name || "-";


            const phone =
              data.phone || "-";


            const totalAmount =
              Number(
                data.totalAmount || 0
              );


            const paidAmount =
              Number(
                data.paidAmount || 0
              );


            let balanceAmount;


            if (
              data.balanceAmount !== undefined
            ) {

              balanceAmount =
                Number(
                  data.balanceAmount
                );

            } else {

              balanceAmount =
                Math.max(
                  totalAmount -
                  paidAmount,
                  0
                );

            }


            count++;

            total +=
              totalAmount;

            received +=
              paidAmount;

            pending +=
              balanceAmount;


            rows += `

              <tr>

                <td>
                  <strong>
                    ${safe(name)}
                  </strong>
                </td>

                <td>
                  ${safe(phone)}
                </td>

                <td>
                  ${money(totalAmount)}
                </td>

                <td class="paid">
                  ${money(paidAmount)}
                </td>

                <td class="${
                  balanceAmount > 0
                    ? "pending"
                    : "paid"
                }">
                  ${money(balanceAmount)}
                </td>

              </tr>

            `;

          }
        );


        loading.style.display =
          "none";


        if (count === 0) {

          container.innerHTML = `

            <div class="empty">

              No sponsors found.

              <br><br>

              Firestore collection:
              <strong>Sponsors</strong>

            </div>

          `;

        } else {

          container.innerHTML = `

            <div class="table-wrapper">

              <table class="sponsor-table">

                <thead>

                  <tr>

                    <th>Name</th>

                    <th>Phone</th>

                    <th>Total</th>

                    <th>Paid</th>

                    <th>Balance</th>

                  </tr>

                </thead>

                <tbody>

                  ${rows}

                </tbody>

              </table>

            </div>

          `;

        }


        /* SUMMARY */

        document.getElementById(
          "totalSponsors"
        ).textContent =
          count;


        document.getElementById(
          "totalSponsorship"
        ).textContent =
          money(total);


        document.getElementById(
          "totalReceived"
        ).textContent =
          money(received);


        document.getElementById(
          "totalPending"
        ).textContent =
          money(pending);


        document.getElementById(
          "systemStatus"
        ).textContent =
          "Firebase Authentication + Firestore connected ✓";


      }

      catch (error) {

        console.error(
          "Firestore error:",
          error
        );


        loading.style.display =
          "none";


        container.innerHTML = `

          <div class="error">

            Firestore data load failed.

            <br><br>

            ${safe(error.message)}

          </div>

        `;


        document.getElementById(
          "systemStatus"
        ).textContent =
          "Firestore error. Check Rules and collection name.";

      }

    }


    /* LOGIN */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "index.html";

          return;

        }


        document.getElementById(
          "adminEmail"
        ).textContent =
          "Logged in as: " +
          user.email;


        await loadSponsors();

      }
    );


    /* LOGOUT */

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async () => {

          await signOut(auth);

          window.location.href =
            "index.html";

        }
      );


    /* SPONSOR BUTTON */

    window.goSponsors =
      function() {

        document
          .getElementById(
            "sponsorsSection"
          )
          .scrollIntoView({
            behavior: "smooth"
          });

      };


    /* TEMP BUTTONS */

    window.comingSoon =
      function(section) {

        alert(
          section +
          " will be added next."
        );

      };


  </script>

</body>
</html>
