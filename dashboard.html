<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - Sponsor Management</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f9;
      color: #1f2937;
    }

    /* HEADER */

    .header {
      background: #0f766e;
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 21px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 4px;
    }

    .logout-btn {
      background: white;
      color: #0f766e;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* MAIN */

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 22px;
    }

    /* CARDS */

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card-title {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 25px;
      font-weight: bold;
      color: #111827;
    }

    /* SECTION */

    .section {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-header h2 {
      font-size: 19px;
    }

    /* BUTTON */

    .add-btn {
      background: #0f766e;
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn:hover {
      background: #0b5f59;
    }

    /* FORM */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #0f766e;
    }

    .save-btn {
      margin-top: 18px;
      background: #0f766e;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .cancel-btn {
      margin-top: 18px;
      margin-left: 8px;
      background: #e5e7eb;
      color: #333;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* TABLE */

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #f8fafc;
      color: #374151;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #9ca3af;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 500px) {

      .container {
        padding: 14px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 17px;
      }

      .header {
        padding: 15px;
      }

    }

  </style>
</head>


<body>

  <!-- HEADER -->

  <div class="header">

    <div>
      <h1>Admin Dashboard</h1>
      <p>Sponsor Management System</p>
    </div>

    <button class="logout-btn" id="logoutBtn">
      Logout
    </button>

  </div>


  <main class="container">

    <!-- DASHBOARD CARDS -->

    <div class="cards">

      <div class="card">
        <div class="card-title">
          Total Sponsors
        </div>

        <div class="card-value" id="totalSponsors">
          0
        </div>
      </div>


      <div class="card">
        <div class="card-title">
          Total Sponsorship
        </div>

        <div class="card-value" id="totalAmount">
          ₹0
        </div>
      </div>


      <div class="card">
        <div class="card-title">
          Paid Amount
        </div>

        <div class="card-value" id="paidAmount">
          ₹0
        </div>
      </div>


      <div class="card">
        <div class="card-title">
          Pending Amount
        </div>

        <div class="card-value" id="pendingAmount">
          ₹0
        </div>
      </div>

    </div>


    <!-- ADD SPONSOR -->

    <div class="section">

      <div class="section-header">

        <h2>
          Add Sponsor
        </h2>

      </div>


      <form id="sponsorForm">

        <div class="form-grid">

          <div class="form-group">

            <label>
              Sponsor Name
            </label>

            <input
              type="text"
              id="name"
              placeholder="Enter sponsor name"
              required
            >

          </div>


          <div class="form-group">

            <label>
              Phone
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="Enter phone number"
            >

          </div>


          <div class="form-group">

            <label>
              Email
            </label>

            <input
              type="email"
              id="email"
              placeholder="Enter email"
            >

          </div>


          <div class="form-group">

            <label>
              Total Sponsorship Amount
            </label>

            <input
              type="number"
              id="totalAmountInput"
              placeholder="Enter amount"
              min="0"
              required
            >

          </div>


          <div class="form-group">

            <label>
              Initial Paid Amount
            </label>

            <input
              type="number"
              id="paidAmountInput"
              placeholder="Enter paid amount"
              min="0"
              value="0"
              required
            >

          </div>

        </div>


        <button
          type="submit"
          class="save-btn"
          id="saveBtn"
        >
          Add Sponsor
        </button>


        <div
          class="message"
          id="message"
        ></div>

      </form>

    </div>


    <!-- SPONSOR LIST -->

    <div class="section">

      <div class="section-header">

        <h2>
          Sponsors
        </h2>

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>
                Sponsor
              </th>

              <th>
                Phone
              </th>

              <th>
                Total
              </th>

              <th>
                Paid
              </th>

              <th>
                Pending
              </th>

              <th>
                Action
              </th>

            </tr>

          </thead>


          <tbody id="sponsorTable">

            <tr>

              <td
                colspan="6"
                class="empty"
              >
                No sponsors yet
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>


  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
      serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* FIREBASE CONFIG */

    const firebaseConfig = {

      apiKey:
        "AIzaSyA4GwvJ1W12dB61MknzffCAazBVN60gCOc",

      authDomain:
        "sponsors-management-port-2300e.firebaseapp.com",

      projectId:
        "sponsors-management-port-2300e",

      storageBucket:
        "sponsors-management-port-2300e.firebasestorage.app",

      messagingSenderId:
        "302644033627",

      appId:
        "1:302644033627:web:bfb03201ee44bcf616677e"

    };


    /* INITIALIZE */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    /* AUTH CHECK */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href = "index.html";

        return;

      }


      console.log(
        "Admin logged in:",
        user.uid
      );

      await loadSponsors();

    });


    /* LOAD SPONSORS */

    async function loadSponsors() {

      try {

        const querySnapshot =
          await getDocs(
            collection(db, "Sponsors")
          );


        const table =
          document.getElementById(
            "sponsorTable"
          );


        table.innerHTML = "";


        let totalSponsors = 0;

        let totalAmount = 0;

        let paidAmount = 0;

        let pendingAmount = 0;


        if (querySnapshot.empty) {

          table.innerHTML = `
            <tr>
              <td colspan="6" class="empty">
                No sponsors yet
              </td>
            </tr>
          `;

        }


        querySnapshot.forEach((document) => {

          const data =
            document.data();


          const total =
            Number(data.totalAmount || 0);

          const paid =
            Number(data.paidAmount || 0);

          const balance =
            Math.max(total - paid, 0);


          totalSponsors++;

          totalAmount += total;

          paidAmount += paid;

          pendingAmount += balance;


          const row =
            document.createElement("tr");


          row.innerHTML = `

            <td>
              ${escapeHTML(data.name || "-")}
            </td>

            <td>
              ${escapeHTML(data.phone || "-")}
            </td>

            <td>
              ₹${total.toLocaleString("en-IN")}
            </td>

            <td>
              ₹${paid.toLocaleString("en-IN")}
            </td>

            <td>
              ₹${balance.toLocaleString("en-IN")}
            </td>

            <td>

              <button
                class="delete-btn"
                data-id="${document.id}"
              >
                Delete
              </button>

            </td>

          `;


          table.appendChild(row);

        });


        document.getElementById(
          "totalSponsors"
        ).textContent =
          totalSponsors;


        document.getElementById(
          "totalAmount"
        ).textContent =
          "₹" +
          totalAmount.toLocaleString("en-IN");


        document.getElementById(
          "paidAmount"
        ).textContent =
          "₹" +
          paidAmount.toLocaleString("en-IN");


        document.getElementById(
          "pendingAmount"
        ).textContent =
          "₹" +
          pendingAmount.toLocaleString("en-IN");


        /* DELETE BUTTONS */

        document
          .querySelectorAll(".delete-btn")
          .forEach((button) => {

            button.addEventListener(
              "click",
              async () => {

                const id =
                  button.dataset.id;


                const confirmDelete =
                  confirm(
                    "Delete this sponsor?"
                  );


                if (!confirmDelete) {
                  return;
                }


                try {

                  await deleteDoc(
                    doc(
                      db,
                      "Sponsors",
                      id
                    )
                  );


                  await loadSponsors();

                } catch (error) {

                  alert(
                    "Delete failed: " +
                    error.message
                  );

                }

              }
            );

          });


      } catch (error) {

        console.error(error);

        document.getElementById(
          "sponsorTable"
        ).innerHTML = `
          <tr>
            <td colspan="6" class="empty">
              Unable to load sponsors.
            </td>
          </tr>
        `;

      }

    }


    /* ADD SPONSOR */

    document
      .getElementById("sponsorForm")
      .addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const name =
            document.getElementById(
              "name"
            ).value.trim();


          const phone =
            document.getElementById(
              "phone"
            ).value.trim();


          const email =
            document.getElementById(
              "email"
            ).value.trim();


          const total =
            Number(
              document.getElementById(
                "totalAmountInput"
              ).value
            );


          const paid =
            Number(
              document.getElementById(
                "paidAmountInput"
              ).value
            );


          const message =
            document.getElementById(
              "message"
            );


          const saveBtn =
            document.getElementById(
              "saveBtn"
            );


          if (paid > total) {

            message.style.color =
              "#dc2626";

            message.textContent =
              "Paid amount cannot be greater than total amount.";

            return;

          }


          saveBtn.disabled = true;

          saveBtn.textContent =
            "Saving...";


          try {

            await addDoc(
              collection(db, "Sponsors"),
              {

                name: name,

                phone: phone,

                email: email,

                totalAmount: total,

                paidAmount: paid,

                balanceAmount:
                  total - paid,

                status:
                  total - paid > 0
                    ? "pending"
                    : "paid",

                createdAt:
                  serverTimestamp()

              }
            );


            message.style.color =
              "#0f766e";

            message.textContent =
              "Sponsor added successfully.";


            document
              .getElementById(
                "sponsorForm"
              )
              .reset();


            document.getElementById(
              "paidAmountInput"
            ).value = "0";


            await loadSponsors();


          } catch (error) {

            console.error(error);

            message.style.color =
              "#dc2626";

            message.textContent =
              "Error: " +
              error.message;

          }


          saveBtn.disabled = false;

          saveBtn.textContent =
            "Add Sponsor";

        }
      );


    /* LOGOUT */

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async () => {

          await signOut(auth);

          window.location.href =
            "index.html";

        }
      );


    /* SECURITY */

    function escapeHTML(value) {

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }

  </script>

</body>
</html>
