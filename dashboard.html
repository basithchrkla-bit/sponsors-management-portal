<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sponsor Portal</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.topbar{
  min-height:65px;
  background:#1473f9;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.topbar h2{
  font-size:21px;
}

.logout{
  background:white;
  color:#1473f9;
  border:0;
  border-radius:10px;
  padding:11px 18px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.card-title{
  color:#777;
  font-size:13px;
  margin-bottom:9px;
}

.card-value{
  font-size:24px;
  font-weight:bold;
}

.section{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.section h2{
  font-size:23px;
  margin-bottom:20px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.menu button{
  border:0;
  background:#edf4ff;
  color:#1473f9;
  padding:17px;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.menu button:hover{
  background:#dceaff;
}

.add-box{
  background:#f8f9fa;
  padding:18px;
  border-radius:12px;
  margin-bottom:20px;
}

.add-box h3{
  margin-bottom:15px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

.add-btn{
  margin-top:12px;
  background:#1473f9;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.table-wrapper{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:750px;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#f8f9fa;
}

.paid{
  color:#198754;
  font-weight:bold;
}

.pending{
  color:#dc3545;
  font-weight:bold;
}

.delete-btn{
  border:0;
  background:#ffe9ed;
  color:#dc3545;
  padding:8px 11px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:25px;
  color:#777;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
  background:#f8f9fa;
  border-radius:12px;
}

.error{
  color:#dc3545;
  background:#fff0f2;
  padding:18px;
  border-radius:12px;
  line-height:1.7;
}

.status{
  background:#f5f6f8;
  padding:18px;
  border-radius:12px;
  text-align:center;
  line-height:2;
}

.success{
  color:#198754;
  font-weight:bold;
}

@media(max-width:800px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .menu{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:500px){

  .container{
    padding:12px;
  }

  .topbar{
    padding:0 18px;
  }

  .topbar h2{
    font-size:17px;
  }

  .logout{
    padding:10px 14px;
  }

  .card{
    padding:15px;
  }

  .card-value{
    font-size:19px;
  }

  .section{
    padding:18px;
  }

}

</style>

</head>


<body>


<div class="topbar">

  <h2>SPONSOR PORTAL</h2>

  <button
    class="logout"
    id="logoutBtn">

    Logout

  </button>

</div>


<div class="container">


<!-- DASHBOARD -->

<div class="cards">

  <div class="card">

    <div class="card-title">
      TOTAL SPONSORS
    </div>

    <div
      class="card-value"
      id="totalSponsors">

      0

    </div>

  </div>


  <div class="card">

    <div class="card-title">
      TOTAL SPONSORSHIP
    </div>

    <div
      class="card-value"
      id="totalAmount">

      ₹0

    </div>

  </div>


  <div class="card">

    <div class="card-title">
      TOTAL RECEIVED
    </div>

    <div
      class="card-value"
      id="totalPaid">

      ₹0

    </div>

  </div>


  <div class="card">

    <div class="card-title">
      TOTAL PENDING
    </div>

    <div
      class="card-value"
      id="totalPending">

      ₹0

    </div>

  </div>

</div>


<!-- MANAGEMENT -->

<div class="section">

  <h2>Management</h2>

  <div class="menu">

    <button
      onclick="scrollToSponsors()">

      👥 Sponsors

    </button>

    <button
      onclick="comingSoon('Payments')">

      💰 Payments

    </button>

    <button
      onclick="comingSoon('Pending')">

      ⏳ Pending

    </button>

    <button
      onclick="comingSoon('Messages')">

      💬 Messages

    </button>

    <button
      onclick="comingSoon('Reminders')">

      🔔 Reminders

    </button>

    <button
      onclick="comingSoon('Reports')">

      📊 Reports

    </button>

    <button
      onclick="comingSoon('Notifications')">

      🔔 Notifications

    </button>

    <button
      onclick="comingSoon('Settings')">

      ⚙️ Settings

    </button>

  </div>

</div>


<!-- SPONSORS -->

<div
  class="section"
  id="sponsorsSection">

  <h2>
    👥 Sponsors
  </h2>


  <!-- ADD SPONSOR -->

  <div class="add-box">

    <h3>
      ➕ Add New Sponsor
    </h3>


    <div class="form-grid">

      <input
        type="text"
        id="name"
        placeholder="Sponsor Name">


      <input
        type="text"
        id="phone"
        placeholder="Phone Number">


      <input
        type="email"
        id="email"
        placeholder="Email">


      <input
        type="number"
        id="totalAmountInput"
        placeholder="Total Sponsorship Amount">


      <input
        type="number"
        id="paidAmountInput"
        placeholder="Paid Amount">

    </div>


    <button
      class="add-btn"
      id="addSponsorBtn">

      Add Sponsor

    </button>

  </div>


  <!-- SPONSOR LIST -->

  <div
    id="result"
    class="loading">

    Loading sponsors...

  </div>

</div>


<!-- SYSTEM STATUS -->

<div class="section">

  <h2>
    System Status
  </h2>

  <div
    id="systemStatus"
    class="status">

    Connecting to Firebase...

  </div>

</div>


</div>


<script type="module">


/* =================================
   FIREBASE IMPORTS
================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  doc
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =================================
   FIREBASE CONFIG
================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyA4GwvJ1W12dB61MknzffCAazBVN60gCOc",

  authDomain:
  "sponsors-management-port-2300e.firebaseapp.com",

  projectId:
  "sponsors-management-port-2300e",

  storageBucket:
  "sponsors-management-port-2300e.firebasestorage.app",

  messagingSenderId:
  "302644033627",

  appId:
  "1:302644033627:web:bfb03201ee44bcf616677e"

};


/* =================================
   INITIALIZE FIREBASE
================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =================================
   COLLECTION
================================= */

const COLLECTION_NAME =
"Sponsors";


/* =================================
   MONEY FORMAT
================================= */

function money(value){

  return new Intl.NumberFormat(
    "en-IN",
    {
      style:"currency",
      currency:"INR",
      maximumFractionDigits:0
    }
  ).format(
    Number(value) || 0
  );

}


/* =================================
   LOAD SPONSORS
================================= */

async function loadSponsors(){

  const result =
  document.getElementById("result");


  try{

    const reference =
    collection(
      db,
      COLLECTION_NAME
    );


    const snapshot =
    await getDocs(reference);


    console.log(
      "Sponsors:",
      snapshot.size
    );


    let totalSponsors = 0;

    let totalAmount = 0;

    let totalPaid = 0;

    let totalPending = 0;

    let rows = "";


    snapshot.forEach(
      (item)=>{

        const data =
        item.data();


        const name =
        data.name || "-";


        const phone =
        data.phone || "-";


        const email =
        data.email || "-";


        const total =
        Number(
          data.totalAmount || 0
        );


        const paid =
        Number(
          data.paidAmount || 0
        );


        const balance =
        Math.max(
          total - paid,
          0
        );


        totalSponsors++;

        totalAmount += total;

        totalPaid += paid;

        totalPending += balance;


        rows += `

          <tr>

            <td>
              <strong>
                ${escapeHtml(name)}
              </strong>
            </td>

            <td>
              ${escapeHtml(phone)}
            </td>

            <td>
              ${escapeHtml(email)}
            </td>

            <td>
              ${money(total)}
            </td>

            <td class="paid">
              ${money(paid)}
            </td>

            <td class="${
              balance > 0
              ? "pending"
              : "paid"
            }">

              ${money(balance)}

            </td>

            <td>

              <button
                class="delete-btn"
                data-id="${item.id}">

                Delete

              </button>

            </td>

          </tr>

        `;

      }
    );


    /* UPDATE DASHBOARD */

    document.getElementById(
      "totalSponsors"
    ).textContent =
    totalSponsors;


    document.getElementById(
      "totalAmount"
    ).textContent =
    money(totalAmount);


    document.getElementById(
      "totalPaid"
    ).textContent =
    money(totalPaid);


    document.getElementById(
      "totalPending"
    ).textContent =
    money(totalPending);


    /* NO DATA */

    if(snapshot.empty){

      result.innerHTML = `

        <div class="empty">

          <h3>
            No sponsors found
          </h3>

          <br>

          Add your first sponsor
          using the form above.

          <br><br>

          Firestore Collection:

          <strong>
            Sponsors
          </strong>

        </div>

      `;

    }


    /* DATA FOUND */

    else{

      result.innerHTML = `

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                <th>Name</th>

                <th>Phone</th>

                <th>Email</th>

                <th>Total</th>

                <th>Paid</th>

                <th>Pending</th>

                <th>Action</th>

              </tr>

            </thead>


            <tbody>

              ${rows}

            </tbody>

          </table>

        </div>

      `;

    }


    /* DELETE BUTTONS */

    document
    .querySelectorAll(".delete-btn")
    .forEach(
      (button)=>{

        button.addEventListener(
          "click",
          async()=>{

            const id =
            button.dataset.id;


            const confirmDelete =
            confirm(
              "Are you sure you want to delete this sponsor?"
            );


            if(!confirmDelete){

              return;

            }


            try{

              await deleteDoc(
                doc(
                  db,
                  COLLECTION_NAME,
                  id
                )
              );


              alert(
                "Sponsor deleted successfully."
              );


              loadSponsors();

            }

            catch(error){

              alert(
                "Delete failed: " +
                error.message
              );

            }

          }
        );

      }
    );


    document.getElementById(
      "systemStatus"
    ).innerHTML = `

      <span class="success">

        Firebase connected ✓

      </span>

      <br>

      Project:

      <strong>
        sponsors-management-port-2300e
      </strong>

      <br>

      Collection:

      <strong>
        Sponsors
      </strong>

      <br>

      Documents:

      <strong>
        ${snapshot.size}
      </strong>

    `;

  }


  catch(error){

    console.error(
      error
    );


    result.innerHTML = `

      <div class="error">

        <strong>
          ❌ Firestore Error
        </strong>

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;


    document.getElementById(
      "systemStatus"
    ).innerHTML = `

      <strong style="color:#dc3545">

        Firebase Error ✕

      </strong>

      <br><br>

      ${escapeHtml(
        error.message
      )}

    `;

  }

}


/* =================================
   ADD SPONSOR
================================= */

document
.getElementById("addSponsorBtn")
.addEventListener(
  "click",
  async()=>{


    const name =
    document.getElementById(
      "name"
    ).value.trim();


    const phone =
    document.getElementById(
      "phone"
    ).value.trim();


    const email =
    document.getElementById(
      "email"
    ).value.trim();


    const totalAmount =
    Number(
      document.getElementById(
        "totalAmountInput"
      ).value
    ) || 0;


    const paidAmount =
    Number(
      document.getElementById(
        "paidAmountInput"
      ).value
    ) || 0;


    if(!name){

      alert(
        "Please enter sponsor name."
      );

      return;

    }


    if(totalAmount <= 0){

      alert(
        "Please enter total sponsorship amount."
      );

      return;

    }


    if(paidAmount > totalAmount){

      alert(
        "Paid amount cannot be greater than total amount."
      );

      return;

    }


    const balanceAmount =
    totalAmount - paidAmount;


    try{

      await addDoc(
        collection(
          db,
          COLLECTION_NAME
        ),
        {

          name:name,

          phone:phone,

          email:email,

          totalAmount:totalAmount,

          paidAmount:paidAmount,

          balanceAmount:balanceAmount,

          createdAt:
          new Date()

        }
      );


      alert(
        "Sponsor added successfully! ✓"
      );


      /* CLEAR FORM */

      document.getElementById(
        "name"
      ).value = "";


      document.getElementById(
        "phone"
      ).value = "";


      document.getElementById(
        "email"
      ).value = "";


      document.getElementById(
        "totalAmountInput"
      ).value = "";


      document.getElementById(
        "paidAmountInput"
      ).value = "";


      /* RELOAD */

      loadSponsors();

    }

    catch(error){

      console.error(
        error
      );


      alert(
        "Sponsor save failed:\n" +
        error.message
      );

    }

  }
);


/* =================================
   ESCAPE HTML
================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =================================
   LOGIN CHECK
================================= */

onAuthStateChanged(
  auth,
  async(user)=>{

    if(!user){

      window.location.href =
      "index.html";

      return;

    }


    console.log(
      "Logged in:",
      user.email
    );


    await loadSponsors();

  }
);


/* =================================
   LOGOUT
================================= */

document
.getElementById("logoutBtn")
.addEventListener(
  "click",
  async()=>{

    await signOut(auth);

    window.location.href =
    "index.html";

  }
);


/* =================================
   MENU
================================= */

window.scrollToSponsors =
function(){

  document
  .getElementById(
    "sponsorsSection"
  )
  .scrollIntoView({
    behavior:"smooth"
  });

};


window.comingSoon =
function(section){

  alert(
    section +
    " will be added next."
  );

};

</script>

</body>
</html>
