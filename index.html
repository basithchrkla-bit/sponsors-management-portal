<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponsor Management Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f6f9;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 28px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #0d6efd;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0d6efd;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0d6efd;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b5ed7;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">SP</div>

    <h1>Sponsor Management</h1>
    <p class="subtitle">Secure Portal Login</p>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginButton">
        LOGIN
      </button>

    </form>

    <div id="message"></div>

    <div class="footer">
      Sponsor Management Portal
    </div>

  </div>


  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    // Firebase Configuration

    const firebaseConfig = {
      apiKey: "AIzaSyA4GwvJ1W12dB61MknzffCAazBVN60gCOc",
      authDomain: "sponsors-management-port-2300e.firebaseapp.com",
      projectId: "sponsors-management-port-2300e",
      storageBucket: "sponsors-management-port-2300e.firebasestorage.app",
      messagingSenderId: "302644033627",
      appId: "1:302644033627:web:bfb03201ee44bcf616677e"
    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // Login

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");


    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      message.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.style.color = "green";
        message.textContent = "Login successful!";


        // Temporary dashboard redirect

        window.location.href = "dashboard.html";


      } catch (error) {

        console.error(error);

        message.style.color = "red";

        if (error.code === "auth/invalid-credential") {

          message.textContent =
            "Email or password is incorrect.";

        } else if (error.code === "auth/invalid-email") {

          message.textContent =
            "Please enter a valid email.";

        } else if (error.code === "auth/too-many-requests") {

          message.textContent =
            "Too many attempts. Please try again later.";

        } else {

          message.textContent =
            "Login failed. Please try again.";

        }

      }


      loginButton.disabled = false;
      loginButton.textContent = "LOGIN";

    });

  </script>

</body>
</html>
