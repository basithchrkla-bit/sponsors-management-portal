<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Sponsor Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .topbar {
      min-height: 65px;
      background: #0d6efd;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar h2 {
      font-size: 20px;
    }

    .logout {
      border: none;
      background: white;
      color: #0d6efd;
      padding: 9px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .welcome p {
      color: #777;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card-title {
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 24px;
      font-weight: bold;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .section h2 {
      margin-bottom: 15px;
      font-size: 19px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .menu button {
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #eef4ff;
      color: #0d6efd;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .menu button:hover {
      background: #dce9ff;
    }

    .sponsor-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .sponsor-table th,
    .sponsor-table td {
      padding: 12px 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    .sponsor-table th {
      background: #f8f9fa;
      color: #555;
    }

    .pending {
      color: #dc3545;
      font-weight: bold;
    }

    .paid {
      color: #198754;
      font-weight: bold;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #f8f9fa;
      color: #777;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media (max-width: 850px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .menu {
        grid-template-columns: repeat(2, 1fr);
      }

      .sponsor-table {
        font-size: 13px;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .card {
        padding: 15px;
      }

      .card-value {
        font-size: 20px;
      }

      .menu {
        grid-template-columns: 1fr 1fr;
      }

      .sponsor-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }

      .topbar h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <h2>SPONSOR PORTAL</h2>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>

  <main class="container">

    <div class="welcome">
      <h1>Admin Dashboard</h1>
      <p id="adminEmail">Loading...</p>
    </div>

    <!-- Dashboard Summary -->

    <div class="cards">

      <div class="card">
        <div class="card-title">TOTAL SPONSORS</div>
        <div class="card-value" id="totalSponsors">0</div>
      </div>

      <div class="card">
        <div class="card-title">TOTAL SPONSORSHIP</div>
        <div class="card-value" id="totalSponsorship">₹0</div>
      </div>

      <div class="card">
        <div class="card-title">TOTAL RECEIVED</div>
        <div class="card-value" id="totalReceived">₹0</div>
      </div>

      <div class="card">
        <div class="card-title">TOTAL PENDING</div>
        <div class="card-value" id="totalPending">₹0</div>
      </div>

    </div>


    <!-- Management -->

    <div class="section">

      <h2>Management</h2>

      <div class="menu">

        <button onclick="scrollToSponsors()">
          👥 Sponsors
        </button>

        <button onclick="comingSoon('Payments')">
          💰 Payments
        </button>

        <button onclick="comingSoon('Pending Payments')">
          ⏳ Pending
        </button>

        <button onclick="comingSoon('Messages')">
          💬 Messages
        </button>

        <button onclick="comingSoon('Reminders')">
          🔔 Reminders
        </button>

        <button onclick="comingSoon('Reports')">
          📊 Reports
        </button>

        <button onclick="comingSoon('Notifications')">
          🔔 Notifications
        </button>

        <button onclick="comingSoon('Settings')">
          ⚙️ Settings
        </button>

      </div>

    </div>


    <!-- Sponsors -->

    <div class="section" id="sponsorsSection">

      <h2>👥 Sponsors</h2>

      <div id="sponsorLoading" class="loading">
        Loading sponsors...
      </div>

      <div id="sponsorTableContainer"></div>

    </div>


    <!-- System Status -->

    <div class="section">

      <h2>System Status</h2>

      <div class="status" id="systemStatus">
        Connecting to Firebase...
      </div>

    </div>

  </main>


  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    // Firebase Configuration

    const firebaseConfig = {
      apiKey: "AIzaSyA4GwvJ1W12dB61MknzffCAazBVN60gCOc",
      authDomain: "sponsors-management-port-2300e.firebaseapp.com",
      projectId: "sponsors-management-port-2300e",
      storageBucket: "sponsors-management-port-2300e.firebasestorage.app",
      messagingSenderId: "302644033627",
      appId: "1:302644033627:web:bfb03201ee44bcf616677e"
    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // Currency formatter

    function formatMoney(amount) {

      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
      }).format(amount || 0);

    }


    // Load Sponsors

    async function loadSponsors() {

      const loading =
        document.getElementById("sponsorLoading");

      const container =
        document.getElementById("sponsorTableContainer");

      try {

        const snapshot =
          await getDocs(collection(db, "sponsors"));


        let totalSponsors = 0;
        let totalSponsorship = 0;
        let totalReceived = 0;
        let totalPending = 0;


        let html = `
          <table class="sponsor-table">

            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Balance</th>
              </tr>
            </thead>

            <tbody>
        `;


        snapshot.forEach((doc) => {

          const sponsor = doc.data();

          const name =
            sponsor.name || "-";

          const phone =
            sponsor.phone || "-";

          const total =
            Number(sponsor.totalAmount || 0);

          const paid =
            Number(sponsor.paidAmount || 0);

          const balance =
            Number(sponsor.balanceAmount || 0);


          totalSponsors++;

          totalSponsorship += total;

          totalReceived += paid;

          totalPending += balance;


          html += `
            <tr>

              <td>
                <strong>${escapeHtml(name)}</strong>
              </td>

              <td>
                ${escapeHtml(phone)}
              </td>

              <td>
                ${formatMoney(total)}
              </td>

              <td class="paid">
                ${formatMoney(paid)}
              </td>

              <td class="${balance > 0 ? "pending" : "paid"}">
                ${formatMoney(balance)}
              </td>

            </tr>
          `;

        });


        html += `
            </tbody>
          </table>
        `;


        loading.style.display = "none";


        if (totalSponsors === 0) {

          container.innerHTML = `
            <div class="empty">
              No sponsors found.
            </div>
          `;

        } else {

          container.innerHTML = html;

        }


        // Update dashboard cards

        document.getElementById("totalSponsors").textContent =
          totalSponsors;

        document.getElementById("totalSponsorship").textContent =
          formatMoney(totalSponsorship);

        document.getElementById("totalReceived").textContent =
          formatMoney(totalReceived);

        document.getElementById("totalPending").textContent =
          formatMoney(totalPending);


        document.getElementById("systemStatus").textContent =
          "Firebase Authentication + Firestore connected ✓";


      } catch (error) {

        console.error(error);

        loading.style.display = "none";

        container.innerHTML = `
          <div class="empty">
            Unable to load sponsor data.
            <br><br>
            Please check Firestore Security Rules.
          </div>
        `;

        document.getElementById("systemStatus").textContent =
          "Firebase connected, but Firestore access was denied.";

      }

    }


    // Prevent HTML injection

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    // Check Login

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href = "index.html";

        return;

      }


      document.getElementById("adminEmail").textContent =
        "Logged in as: " + user.email;


      await loadSponsors();

    });


    // Logout

    document
      .getElementById("logoutBtn")
      .addEventListener("click", async () => {

        try {

          await signOut(auth);

          window.location.href = "index.html";

        } catch (error) {

          console.error(error);

          alert("Logout failed.");

        }

      });


    // Scroll to Sponsors

    window.scrollToSponsors = function() {

      document
        .getElementById("sponsorsSection")
        .scrollIntoView({
          behavior: "smooth"
        });

    };


    // Temporary sections

    window.comingSoon = function(section) {

      alert(
        section +
        " will be added in the next step."
      );

    };

  </script>

</body>
</html>
