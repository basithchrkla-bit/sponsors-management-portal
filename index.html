<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sponsor Management</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.20);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #0f766e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #123;
      font-size: 25px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 2px rgba(15,118,110,0.10);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b5f59;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #d32f2f;
      min-height: 20px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      SP
    </div>

    <h1>Sponsor Management</h1>

    <p class="subtitle">
      Login to continue
    </p>

    <form id="loginForm">

      <label for="email">Email / Sponsor ID</label>

      <input
        type="text"
        id="email"
        placeholder="Enter Email or Sponsor ID"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
      >

      <button type="submit">
        Login
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="footer">
      Sponsor Management System
    </div>

  </div>


  <script>

    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      if (!email || !password) {
        message.textContent = "Please enter your login details.";
        return;
      }

      message.style.color = "#0f766e";
      message.textContent = "Login system will be connected in the next step.";

    });

  </script>

</body>
</html>
